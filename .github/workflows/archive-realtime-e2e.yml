name: Archive Realtime E2E

on:
  pull_request:
    paths:
      - ".github/workflows/archive-realtime-e2e.yml"
      - "app/api/push/send/route.ts"
      - "app/questions/**"
      - "components/QuestionComments.tsx"
      - "lib/dailyQuestions.ts"
      - "lib/apiSecurity.ts"
      - "lib/notifications.ts"
      - "lib/questionArchive.ts"
      - "lib/supabaseClient.ts"
      - "lib/supabaseUrls.ts"
      - "package-lock.json"
      - "package.json"
      - "playwright.realtime.config.ts"
      - "supabase/migrations/**"
      - "tests/archive-realtime.spec.ts"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to run the browser flow"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - local-build

permissions:
  contents: read

concurrency:
  group: archive-realtime-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archive-realtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_BASE_URL: ${{ (github.event_name == 'schedule' || inputs.target == 'production') && 'https://couple-space-kappa.vercel.app' || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify archive and Realtime
        run: npm run test:e2e:archive-realtime

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-realtime-e2e-${{ github.run_id }}
          path: |
            playwright-report
            .playwright-results
          if-no-files-found: ignore
          retention-days: 7
